server:
  port: 8080
  host: 0.0.0.0
  features:
    observe:
      observers:
        health:
          details: false

declarative:
  ignore-incubating: true

data:
  sources:
    sql:
      - name: "pokemon"
        provider.hikari:
          username: "sa"
          password: ""
          url: "jdbc:h2:file:./pokemons;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE"
          jdbc-driver-class-name: "org.h2.Driver"
  persistence-units:
    jakarta:
      - data-source: "pokemon"
        properties:
          eclipselink.target-database: "org.eclipse.persistence.platform.database.H2Platform"
          eclipselink.target-server: "None"
#          jakarta.persistence.schema-generation.create-source: "metadata"
#          jakarta.persistence.schema-generation.drop-source: "metadata"
#          jakarta.persistence.schema-generation.database.action: "create"
