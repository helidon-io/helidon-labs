server:
  host: "0.0.0.0"
  port: 8080

langchain4j:
  providers:
    open-ai:
      api-key: "demo"

    lc4j-in-process:
      type: all_minilm_l6_v2_q

    lc4j-content-retriever:
      embedding-model: hol-embedding-model
      max-results: 20
      min-score: 0.6

  models:
    hol-embedding-model:
      provider: lc4j-in-process

    hol-model:
      provider: open-ai
      model-name: "gpt-4o-mini"

  embedding-stores:
    hol-embedding-store:
      provider: lc4j-in-memory

  content-retrievers:
    hol-content-retriever:
      provider: lc4j-content-retriever
      embedding-store: hol-embedding-store

app:
  menu-items: "../../data/menu.json"
