server:
  host: "0.0.0.0"
  port: 8080
  features:
    static-content:
      classpath:
        - context: "/"
          location: "/WEB"
          welcome: "index.html"

declarative:
  ignore-incubating: true;

langchain4j:
  providers:
    lc4j-in-process:
      type: all_minilm_l6_v2_q

    open-ai:
      # Using OpenAI provider to call OCI GenAI model over OpenAI compatible API
      api-key: "${OCI_API_KEY}"
      base-url: https://inference.generativeai.us-chicago-1.oci.oraclecloud.com/20231130/actions
      log-requests: false
      log-responses: false

    lc4j-content-retriever:
      embedding-model: assistant-embedding-model
      max-results: 20
      min-score: 0.6

  models:
    assistant-embedding-model:
      provider: lc4j-in-process

    expensive-model:
      provider: open-ai
      model-name: "openai.gpt-oss-120b"
      strict-json-schema: true

  embedding-stores:
    basic-embedding-store:
      provider: lc4j-in-memory
      from-file: ../../data/all-embeddings.json

  content-retrievers:
    basic-content-retriever:
      provider: lc4j-content-retriever
      embedding-store: basic-embedding-store

app:
  latest-helidon-version: 4.3.4
  docs-zip-path: ../../data/helidon-docs.zip